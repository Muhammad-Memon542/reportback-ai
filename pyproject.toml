[project]
name = "reportback"
version = "0.1.0"
description = "Links Toronto City Council report-back directives to the staff reports that answered them."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "openai>=3.58.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pyyaml>=6.0.4",
    "selectolax>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
reportback = "reportback.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "reportback"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-openpyxl>=3.1.5.20261122",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "S", "DTZ", "T20"]
ignore = [
  "RUF001",  # ambiguous unicode: the en dash in "Open Government Licence – Toronto" is the official name
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "DTZ001"]  # asserts, fake keys, naive Excel-style datetimes
"scripts/**" = ["T201", "S608"]        # scripts print; SQL built from fixed identifiers
"evals/**" = ["T201", "S311"]          # eval scripts print; seeded sampling is not crypto
"reportback/cli.py" = ["T201"]         # the CLI prints by design
"reportback/coverage.py" = ["E501"]    # long SQL and Markdown table strings

[tool.mypy]
python_version = "3.12"
files = ["reportback"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportback.ingest.background"]  # pymupdf ships without type hints
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error", "ignore::UserWarning:openpyxl"]
