# Canonical City divisions, offices and agencies, with the strings that map to them.
#
# Matching (reportback/ingest/divisions.py): case-insensitive; '&' == 'and'; punctuation and
# dashes ignored; whole words only; longest alias wins and consumes its text, so
# "Deputy City Manager, Corporate Services" does not also match "City Manager".
#
# successors: divisions that later took over this one's work (renames/splits). They are
# added to divisions[] so a directive assigned to the old name can be matched to reports
# from the new one.
#
# Sources: the Clerk's own division lookup sheet in the Report Request Log workbook, and
# the official titles used in the "Assigned to" column (2018-2022 and 2022-2026 logs).

ignore:  # consumed without producing a division (too generic to map)
  - deputy city manager
  - appropriate staff
  - city divisions identified as action leads
  - executive management
  - applicable agencies and divisions
  - all other relevant city divisions

divisions:
  # --- Infrastructure Services / Development and Growth Services clusters ---
