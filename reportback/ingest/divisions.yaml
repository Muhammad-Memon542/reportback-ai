  - name: Transit Expansion Office
    aliases: [transit expansion]
  - name: City Planning
    aliases: [city planning, chief planner, community planning, heritage planning]
    successors: [Development Review]
  - name: Development Review
    aliases: [development review]
  - name: Toronto Building
    aliases: [toronto building, chief building official]
  - name: Municipal Licensing and Standards
    aliases: [municipal licensing and standards, municipal licensing and standard]  # second: typo in the log
